# api/openapi.yaml
openapi: 3.0.3
info:
  title: PayScale HTTPE API
  description: >
    High-Throughput Transaction Processing Engine API for PayScale Financial
    Technologies. Covers P2P payments, transaction lookup, reversal, account
    operations, merchant settlement, and webhook delivery. All financial
    write endpoints require an Idempotency-Key header (FR-002).
  version: 1.0.0
  contact:
    name: PayScale Engineering
servers:
  - url: https://api.payscale.example.com/v1
    description: Production (ap-south-1)
  - url: https://sandbox.payscale.example.com/v1
    description: Sandbox

tags:
  - name: Payments
    description: P2P payment submission and lifecycle
  - name: Transactions
    description: Transaction lookup and status
  - name: Accounts
    description: Account operations
  - name: Settlements
    description: Merchant batch settlement operations
  - name: Health
    description: Service health and readiness

paths:
  /payments:
    post:
      tags: [Payments]
      operationId: submitPayment
      summary: Submit a P2P payment
      description: >
        Initiates a P2P payment. Idempotent per FR-002 -- a retried request
        with the same Idempotency-Key returns the original result without
        reprocessing (see docs/04, Failure Scenario 3).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
            example:
              source_account_id: "018f2e2a-7b3c-7a4e-9c1d-1a2b3c4d5e6f"
              destination_account_id: "018f2e2a-7b3c-7a4e-9c1d-1a2b3c4d5e70"
              amount: "500.00"
              currency: "INR"
              metadata:
                device_id: "device-abc123"
      responses:
        "200":
          description: Payment completed synchronously
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "202":
          description: >
            Payment accepted for processing but fraud review deferred
            (Option C bounded-fallback path, docs/09) -- final status
            confirmed via webhook or polling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A request with this Idempotency-Key is already processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Transaction rejected (insufficient funds, frozen account, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      callbacks:
        transactionStatusUpdate:
          "{$request.body#/webhook_url}":
            post:
              summary: Webhook delivery for transaction status changes (FR-008)
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/WebhookPayload"
              responses:
                "200":
                  description: Webhook received successfully

  /transactions/{transactionId}:
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Retrieve a transaction by ID
      parameters:
        - $ref: "#/components/parameters/TransactionIdPath"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Transaction found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /transactions/{transactionId}/status:
    get:
      tags: [Transactions]
      operationId: getTransactionStatus
      summary: Lightweight status check (poll-friendly, cheaper than full lookup)
      parameters:
        - $ref: "#/components/parameters/TransactionIdPath"
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /transactions/{transactionId}/reversal:
    post:
      tags: [Transactions]
      operationId: reverseTransaction
      summary: Trigger a transaction reversal (FR-005, 30s SLA)
      parameters:
        - $ref: "#/components/parameters/TransactionIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReversalRequest"
      responses:
        "200":
          description: Reversal completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "409":
          description: Transaction already reversed or not eligible for reversal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{accountId}:
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Retrieve account details and balances
      parameters:
        - $ref: "#/components/parameters/AccountIdPath"
      responses:
        "200":
          description: Account found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{accountId}/transactions:
    get:
      tags: [Accounts]
      operationId: listAccountTransactions
      summary: List transactions for an account (cursor-paginated)
      parameters:
        - $ref: "#/components/parameters/AccountIdPath"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated transaction list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTransactions"
        "404":
          $ref: "#/components/responses/NotFound"

  /merchants/{merchantId}/settlements:
    post:
      tags: [Settlements]
      operationId: triggerSettlement
      summary: Trigger a merchant settlement batch (FR-006, up to 100,000 txns)
      parameters:
        - $ref: "#/components/parameters/MerchantIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementRequest"
      responses:
        "202":
          description: Settlement batch accepted for async processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /merchants/{merchantId}/settlements/{settlementId}:
    get:
      tags: [Settlements]
      operationId: getSettlement
      summary: Retrieve settlement batch status
      parameters:
        - $ref: "#/components/parameters/MerchantIdPath"
        - name: settlementId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Settlement found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Service health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service is unhealthy or degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key, 24hr TTL (FR-002)
      schema:
        type: string
        maxLength: 128
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Client-supplied trace correlation ID, propagated via OpenTelemetry (docs/03 Observability Stack)
      schema:
        type: string
        format: uuid
    TransactionIdPath:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountIdPath:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MerchantIdPath:
      name: merchantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous response's next_cursor field
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limit exceeded for this account tier (see docs/10 rate-limit table)
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit window resets
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    PaymentRequest:
      type: object
      required: [source_account_id, destination_account_id, amount, currency]
      properties:
        source_account_id:
          type: string
          format: uuid
        destination_account_id:
          type: string
          format: uuid
        amount:
          type: string
          description: Decimal amount as a string to avoid floating-point precision loss (matches NUMERIC(18,4) in schemas/ddl/002)
          example: "500.00"
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: INR
        webhook_url:
          type: string
          format: uri
          description: Optional per-request webhook override for status callbacks
        metadata:
          type: object
          additionalProperties: true

    ReversalRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum:
            [CUSTOMER_REQUEST, FRAUD_CONFIRMED, SYSTEM_ERROR, MERCHANT_REQUEST]

    TransactionResponse:
      type: object
      properties:
        transaction_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [INITIATED, PROCESSING, COMPLETED, FAILED, REVERSED]
        transaction_type:
          type: string
          enum: [P2P, MERCHANT_PAYMENT, SETTLEMENT, REVERSAL, FEE]
        source_account_id:
          type: string
          format: uuid
          nullable: true
        destination_account_id:
          type: string
          format: uuid
          nullable: true
        amount:
          type: string
        currency:
          type: string
        failure_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    TransactionStatusResponse:
      type: object
      properties:
        transaction_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [INITIATED, PROCESSING, COMPLETED, FAILED, REVERSED]
        updated_at:
          type: string
          format: date-time

    AccountResponse:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
        account_type:
          type: string
          enum: [SAVINGS, CURRENT, WALLET, MERCHANT, SETTLEMENT_POOL]
        currency:
          type: string
        available_balance:
          type: string
        ledger_balance:
          type: string
        status:
          type: string
          enum: [ACTIVE, FROZEN, SUSPENDED, CLOSED]
        tier:
          type: string
          enum: [BASIC, PREMIUM, MERCHANT]

    PaginatedTransactions:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TransactionResponse"
        next_cursor:
          type: string
          nullable: true
          description: Pass as the cursor query param to fetch the next page; null when no further pages exist
        has_more:
          type: boolean

    SettlementRequest:
      type: object
      required: [settlement_window_start, settlement_window_end]
      properties:
        settlement_window_start:
          type: string
          format: date-time
        settlement_window_end:
          type: string
          format: date-time

    SettlementResponse:
      type: object
      properties:
        settlement_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, PARTIALLY_COMPLETED, FAILED]
        total_transaction_count:
          type: integer
        processed_count:
          type: integer
        failed_chunk_count:
          type: integer
        total_amount:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    WebhookPayload:
      type: object
      properties:
        event_type:
          type: string
          enum: [txn.completed, txn.failed, txn.reversed, settlement.completed]
        transaction_id:
          type: string
          format: uuid
        status:
          type: string
        timestamp:
          type: string
          format: date-time

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [up, down, degraded]

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code (see docs/10 error code table)
              example: INSUFFICIENT_FUNDS
            message:
              type: string
              example: "Account balance insufficient for requested amount"
            correlation_id:
              type: string
              format: uuid
            details:
              type: object
              additionalProperties: true

security:
  - bearerAuth: []
